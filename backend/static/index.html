<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filmecho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Editorial "trade paper" palette — a studio intelligence memo, not
       a dashboard, so the base is paper and ink rather than a dark UI. */
    --bg: #f1ecdf;
    --bg-wash: radial-gradient(ellipse 1400px 700px at 50% -12%, rgba(156,43,43,0.05), transparent 60%);
    --surface: #faf7ef;
    --surface-raised: #fffdf8;
    --border: #ddd2b4;
    --text: #211d17;
    --text-muted: #736a58;

    --brand-a: #d9622e;
    --brand-b: #b8272a;
    --brand-c: #23415c;

    --gold: #9c6a17;

    --positive: #2f6e3e;
    --positive-dim: #dcebd5;
    --negative: #9c2b2b;
    --negative-dim: #f2dad1;
    --neutral: #9c6a17;
    --neutral-dim: #f5e4b0;
    --unclear: #736a58;
    --unclear-dim: #ece5d2;

    --marketing-accent: #6c4f8c;
    --marketing-tint: #f0eaf7;
    --cast-accent: #1f6e7a;
    --cast-tint: #e4f1f1;
    --news-accent: #b0512d;
    --news-tint: #f8e9df;

    /* A deep oxblood, distinct from --ink, reserved for the marquee
       band behind the wordmark — the one deliberately "loud" moment
       on the page, styled like an actual theater marquee sign. */
    --marquee-bg: #3b1220;

    /* A small set of colors reserved for the few spots that are always
       a dark "chip" or overlay regardless of the overall (now light)
       theme — a poster-image caption bar and the live activity log —
       so those keep working as dark surfaces with light text. */
    --ink: #211d17;
    --on-ink: #f5f1e6;
    --on-ink-muted: #c9c0a8;
    --gold-on-ink: #e7b75c;
    --brand-c-on-ink: #8fb4d8;
    --positive-on-ink: #6fcb86;
    --negative-on-ink: #ff8a78;
    --neutral-on-ink: #f0c15c;

    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Inter", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    background-image: var(--bg-wash);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.55;
    min-height: 100vh;
  }

  /* A literal filmstrip edge — an ink band with the page color punched
     through as sprocket holes — rather than a generic decorative line. */
  .film-strip {
    height: 14px;
    background-color: var(--ink);
    background-image: radial-gradient(circle, var(--bg) 3px, transparent 3.2px);
    background-size: 24px 14px;
    background-repeat: repeat-x;
    background-position: center;
  }

  .page { max-width: 1320px; margin: 0 auto; padding: 44px 28px 110px; }
  .hero { max-width: 660px; margin: 0 auto; text-align: center; }

  /* The one loud moment on the page: a theater-marquee sign, sprocket
     holes punched along its top and bottom edge like the filmstrip
     bar, holding the wordmark instead of it just sitting on plain
     paper. This is where the design should spend its boldness. */
  .marquee-band {
    background: var(--marquee-bg);
    border-radius: 10px;
    padding: 30px 24px 22px;
    position: relative;
    overflow: hidden;
  }
  .marquee-band::before, .marquee-band::after {
    content: ""; position: absolute; left: 0; right: 0; height: 10px;
    background-image: radial-gradient(circle, var(--bg) 2.4px, transparent 2.6px);
    background-size: 20px 10px; background-position: center; background-repeat: repeat-x;
  }
  .marquee-band::before { top: 0; }
  .marquee-band::after { bottom: 0; }

  /* --- Filmecho wordmark: a letterpress double-strike on "ECHO", as if
     the plate slipped slightly on the reprint — one offset ghost, not
     a four-layer glow. Reads as an intentional print artifact, and
     (as a bonus) it's a single duplicate instead of four, so it holds
     up cleanly when printed or copy-pasted. --- */
  .filmecho-logo {
    font-family: var(--font-display);
    font-size: clamp(2.1rem, 8vw, 3.6rem);
    font-weight: 900;
    display: flex;
    align-items: baseline;
    justify-content: center;
    letter-spacing: -0.01em;
    user-select: none;
    margin: 10px 0 6px;
  }
  .logo-film { color: var(--on-ink); margin-right: 0.16em; }
  .logo-echo-wrapper { position: relative; display: inline-block; }
  .logo-echo-main { color: var(--gold-on-ink); position: relative; z-index: 2; font-style: italic; }
  .echo-trail { position: absolute; top: 0; left: 3px; color: var(--gold-on-ink); opacity: 0.35; z-index: 1; font-style: italic; }

  .tagline { color: var(--on-ink-muted); font-size: 0.95rem; margin: 0; }

  .search-row { display: flex; gap: 10px; margin: 30px 0 0; }

  .example-chips {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 8px; margin-top: 14px;
  }
  .example-chips-label {
    font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted);
    margin-right: 2px;
  }
  .example-chip {
    background: var(--neutral-dim); border: 1px solid var(--border); color: var(--text);
    font-family: var(--font-body); font-size: 0.78rem; padding: 5px 12px;
    border-radius: 20px; cursor: pointer; transition: all 0.15s ease;
  }
  .example-chip:hover { background: var(--brand-b); border-color: var(--brand-b); color: var(--on-ink); }

  #title-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 1rem;
    padding: 14px 16px;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  #title-input:focus { border-color: var(--brand-c); box-shadow: 0 0 0 3px rgba(35,65,92,0.16); }
  #title-input::placeholder { color: var(--text-muted); }

  #search-btn {
    background: linear-gradient(90deg, var(--brand-a), var(--brand-b));
    color: var(--on-ink);
    border: none;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.95rem;
    padding: 0 28px;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  #search-btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
  #search-btn:disabled { opacity: 0.5; cursor: default; }
  #search-btn:focus-visible, #title-input:focus-visible { outline: 2px solid var(--brand-c); outline-offset: 2px; }

  /* --- Progress checklist --- */
  .progress {
    display: none;
    margin: 28px auto 0;
    max-width: 480px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    text-align: left;
  }
  .progress.visible { display: block; }

  .progress-title {
    font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.03em;
    text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: center;
  }

  .progress-timer {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: 0.8rem; color: var(--gold);
    margin-bottom: 16px;
  }
  .progress-timer-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--gold);
  }
  @media (prefers-reduced-motion: no-preference) {
    .progress-timer-dot { animation: pulse 1s ease-in-out infinite; }
  }

  .progress-item { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 0.88rem; color: var(--text-muted); }

  .activity-feed-title {
    font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.03em;
    text-transform: uppercase; color: var(--text-muted); margin: 18px 0 8px;
    padding-top: 14px; border-top: 1px solid var(--border);
  }
  .activity-feed {
    max-height: 160px; overflow-y: auto; font-family: var(--font-mono);
    font-size: 0.76rem; line-height: 1.7; color: var(--on-ink-muted);
    background: var(--ink); border-radius: 6px; padding: 10px 12px;
  }
  .activity-line { white-space: pre-wrap; word-break: break-word; }
  .activity-line .agent-tag { color: var(--brand-c-on-ink); }
  .activity-line .tool-call { color: var(--gold-on-ink); }
  .activity-line .tool-return { color: var(--positive-on-ink); }
  @media (prefers-reduced-motion: no-preference) {
    .activity-line.new { animation: activityIn 0.25s ease; }
  }
  @keyframes activityIn { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: translateX(0); } }
  .progress-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; background: var(--unclear-dim); border: 1px solid var(--border); }
  .progress-item.active { color: var(--text); }
  .progress-item.active .progress-dot { background: var(--gold); border-color: var(--gold); }
  @media (prefers-reduced-motion: no-preference) { .progress-item.active .progress-dot { animation: pulse 1s ease-in-out infinite; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .progress-item.done { color: var(--positive); }
  .progress-item.done .progress-dot { background: var(--positive); border-color: var(--positive); }

  .status { text-align: center; color: var(--negative); font-family: var(--font-mono); font-size: 0.85rem; margin-top: 16px; display: none; }
  .status.visible { display: block; }

  .candidate-chip {
    background: var(--surface-raised); border: 1px solid var(--negative); color: var(--text);
    font-family: var(--font-mono); font-size: 0.78rem; padding: 5px 12px; border-radius: 20px;
    cursor: pointer; margin: 2px;
  }
  .candidate-chip:hover { background: var(--negative-dim); }

  /* --- Frozen-memo note (released titles are served from cache) --- */
  .cache-note {
    display: none; max-width: 900px; margin: 20px auto 0;
    background: var(--unclear-dim); border: 1px solid var(--border); border-radius: 4px;
    padding: 10px 16px; font-size: 0.85rem; color: var(--text);
    align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between;
  }
  .cache-note.visible { display: flex; }
  .cache-note-text { flex: 1; min-width: 200px; }
  #refresh-btn {
    background: none; border: 1px solid var(--brand-c); color: var(--brand-c);
    font-family: var(--font-body); font-size: 0.82rem; padding: 6px 14px;
    border-radius: 6px; cursor: pointer; transition: all 0.15s ease; white-space: nowrap;
  }
  #refresh-btn:hover:not(:disabled) { background: var(--brand-c); color: var(--on-ink); }
  #refresh-btn:disabled { opacity: 0.5; cursor: default; }

  @media (prefers-reduced-motion: no-preference) {
    .hero-banner, .panel, .greenlight-card, .war-room, .release-window-card { animation: rise 0.35s ease; }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* --- Full-bleed hero banner (poster + overlaid title/meta) --- */
  .hero-banner {
    display: none;
    position: relative;
    margin-top: 34px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface);
    box-shadow: 0 10px 28px rgba(33,29,23,0.14);
  }
  .hero-banner.visible { display: block; }

  .hero-banner img {
    width: 100%;
    display: block;
    aspect-ratio: 21/8;
    object-fit: cover;
    min-height: 200px;
  }

  .hero-banner-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(0deg, rgba(33,29,23,0.94) 0%, rgba(33,29,23,0.55) 45%, rgba(33,29,23,0.06) 75%);
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 24px 28px;
  }

  /* Reads as a marquee caption card over the poster art, so it stays a
     dark "chip" — with its own on-ink accent set — regardless of the
     surrounding (now light) theme. */
  .hero-banner-title {
    font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--gold-on-ink); margin-bottom: 10px;
  }

  .hero-banner-meta { display: flex; flex-wrap: wrap; gap: 8px; }

  .meta-pill {
    font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.02em;
    padding: 5px 12px; border-radius: 4px; border: 1px solid rgba(245,241,230,0.25);
    color: var(--on-ink-muted); background: rgba(33,29,23,0.55);
  }
  .meta-pill.info { border-color: var(--brand-c-on-ink); color: var(--brand-c-on-ink); }
  .meta-pill.confidence-high { border-color: var(--positive-on-ink); color: var(--positive-on-ink); }
  .meta-pill.confidence-medium { border-color: var(--neutral-on-ink); color: var(--neutral-on-ink); }
  .meta-pill.confidence-low { border-color: var(--negative-on-ink); color: var(--negative-on-ink); }

  /* Fallback text-only banner when no poster image is available — this
     one sits on the light page, not a dark overlay, so its title and
     pills switch back to the standard (dark-on-light) tokens. */
  .marquee-fallback {
    display: none;
    margin-top: 34px;
    text-align: center;
    padding: 20px 18px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
  }
  .marquee-fallback.visible { display: block; }
  .marquee-fallback .hero-banner-title { color: var(--gold); }
  .marquee-fallback .meta-pill {
    color: var(--text-muted); background: var(--unclear-dim); border-color: var(--border);
  }
  .marquee-fallback .meta-pill.info { border-color: var(--cast-accent); color: var(--cast-accent); }
  .marquee-fallback .meta-pill.confidence-high { border-color: var(--positive); color: var(--positive); }
  .marquee-fallback .meta-pill.confidence-medium { border-color: var(--neutral); color: var(--neutral); }
  .marquee-fallback .meta-pill.confidence-low { border-color: var(--negative); color: var(--negative); }
  .marquee-fallback .hero-banner-meta { justify-content: center; }

  /* --- Greenlight Memo: the verdict-first centerpiece --- */
  .greenlight-card {
    display: none;
    max-width: 900px; margin: 34px auto 0;
    background: var(--surface-raised); border: 1px solid var(--border);
    border-radius: 4px; padding: 34px 32px;
    box-shadow: 0 8px 24px rgba(33,29,23,0.10);
  }
  .greenlight-card.visible { display: block; }
  .greenlight-card.tone-positive { border-left: 4px solid var(--positive); }
  .greenlight-card.tone-negative { border-left: 4px solid var(--negative); }
  .greenlight-card.tone-neutral { border-left: 4px solid var(--neutral); }

  .verdict-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 6px; }

  /* A rubber-stamp mark, not a rounded status pill — this is a studio
     memo being "stamped" approved/held, not a dashboard badge. */
  .verdict-badge {
    font-family: var(--font-mono); font-weight: 700; font-size: 0.85rem;
    letter-spacing: 0.03em; text-transform: uppercase; padding: 7px 16px;
    border: 2px solid; border-radius: 3px; transform: rotate(-2deg);
    display: inline-flex; align-items: center; gap: 8px; background: none;
  }
  .verdict-dot { width: 9px; height: 9px; border-radius: 50%; }
  .verdict-badge.tone-positive { border-color: var(--positive); color: var(--positive); }
  .verdict-badge.tone-negative { border-color: var(--negative); color: var(--negative); }
  .verdict-badge.tone-neutral { border-color: var(--neutral); color: var(--neutral); }
  .verdict-badge.tone-positive .verdict-dot { background: var(--positive); }
  .verdict-badge.tone-negative .verdict-dot { background: var(--negative); }
  .verdict-badge.tone-neutral .verdict-dot { background: var(--neutral); }

  .confidence-wrap { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 0.82rem; color: var(--text-muted); }
  .confidence-bar { width: 90px; height: 6px; border-radius: 3px; background: var(--unclear-dim); overflow: hidden; }
  .confidence-bar-fill { height: 100%; border-radius: 3px; }
  .confidence-bar-fill.tone-positive { background: var(--positive); }
  .confidence-bar-fill.tone-negative { background: var(--negative); }
  .confidence-bar-fill.tone-neutral { background: var(--neutral); }

  .greenlight-card h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.55rem; margin: 14px 0 22px; line-height: 1.35; }

  .opp-risk-row { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 22px; }
  @media (min-width: 640px) { .opp-risk-row { grid-template-columns: 1fr 1fr; } }
  .opp-risk-tile { border-radius: 10px; padding: 16px 18px; border: 1px solid var(--border); }
  .opp-risk-tile.opportunity { border-color: var(--positive); background: linear-gradient(135deg, var(--positive-dim), var(--surface-raised) 70%); }
  .opp-risk-tile.risk { border-color: var(--negative); background: linear-gradient(135deg, var(--negative-dim), var(--surface-raised) 70%); }
  .opp-risk-label { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.03em; text-transform: uppercase; margin-bottom: 6px; }
  .opp-risk-tile.opportunity .opp-risk-label { color: var(--positive); }
  .opp-risk-tile.risk .opp-risk-label { color: var(--negative); }

  /* --- War Room --- */
  .war-room { display: none; max-width: 1180px; margin: 24px auto 0; }
  .war-room.visible { display: block; }
  .war-room-title {
    font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.03em;
    text-transform: uppercase; color: var(--text-muted); text-align: center; margin-bottom: 16px;
  }
  .war-room-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 700px) { .war-room-grid { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1050px) { .war-room-grid { grid-template-columns: 1fr 1fr 1fr; } }
  /* Each seat at the table gets its own accent rather than an identical
     box, so the grid reads as six distinct voices, not six repeats. */
  .voice-card {
    background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--border);
    border-radius: 4px; padding: 16px 18px; box-shadow: 0 3px 10px rgba(33,29,23,0.06);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .voice-card:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(33,29,23,0.10); }
  .voice-card.role-director { border-top-color: var(--brand-b); }
  .voice-card.role-producer { border-top-color: var(--ink); }
  .voice-card.role-marketing_chief { border-top-color: var(--marketing-accent); }
  .voice-card.role-casting_executive { border-top-color: var(--cast-accent); }
  .voice-card.role-distribution_executive { border-top-color: var(--gold); }
  .voice-card.role-analyst { border-top-color: var(--brand-c); }
  .voice-role { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.9rem; margin-bottom: 8px; }
  .voice-icon { font-size: 1.1rem; }
  .voice-insight { font-family: var(--font-display); font-style: italic; font-size: 0.95rem; color: var(--text); line-height: 1.5; }

  /* --- Reputation timeline (deferred feature, now built) --- */
  .timeline-card { display: none; max-width: 1050px; margin: 22px auto 0; }
  .timeline-card.visible { display: block; }
  .timeline-title {
    font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.03em;
    text-transform: uppercase; color: var(--text-muted); text-align: center; margin-bottom: 16px;
  }
  .timeline-track { display: flex; flex-direction: column; gap: 0; }
  @media (min-width: 760px) { .timeline-track { flex-direction: row; align-items: stretch; } }
  .timeline-stop { flex: 1; position: relative; padding: 0 0 0 26px; margin-bottom: 18px; }
  @media (min-width: 760px) { .timeline-stop { padding: 26px 14px 0; margin-bottom: 0; } }
  .timeline-stop::before {
    content: ""; position: absolute; left: 3px; top: 4px; width: 12px; height: 12px;
    border-radius: 50%; border: 2px solid var(--surface-raised);
  }
  @media (min-width: 760px) { .timeline-stop::before { left: 50%; top: 0; margin-left: -7px; } }
  .timeline-stop::after {
    content: ""; position: absolute; left: 8px; top: 16px; bottom: -18px; width: 2px;
    background: var(--border);
  }
  @media (min-width: 760px) { .timeline-stop::after { left: 0; right: 0; top: 6px; bottom: auto; width: auto; height: 2px; } }
  .timeline-stop:last-child::after { display: none; }
  .timeline-stop.tone-positive::before { background: var(--positive); }
  .timeline-stop.tone-negative::before { background: var(--negative); }
  .timeline-stop.tone-neutral::before { background: var(--neutral); }
  .timeline-stop.tone-unclear::before { background: var(--unclear); }
  .timeline-phase-label {
    font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.03em;
    text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px;
  }
  .timeline-note { font-size: 0.9rem; color: var(--text); }

  /* --- Release window advisory --- */
  .release-window-card {
    display: none; max-width: 900px; margin: 20px auto 0;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 22px;
  }
  .release-window-card.visible { display: block; }
  .rw-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .rw-title { font-weight: 700; font-size: 0.92rem; }
  .rw-caveat { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-muted); margin-top: 10px; font-style: italic; }

  /* --- Evidence sub-tabs (single bar, no more Studio/Fan split) --- */
  .evidence-section { display: none; max-width: 1180px; margin: 34px auto 0; background: var(--surface-raised); border: 1px solid var(--border); border-radius: 14px; }
  .evidence-section.visible { display: block; }

  .subtabs { display: flex; gap: 4px; padding: 14px 24px 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .subtab-btn {
    background: none; border: none; color: var(--text-muted); font-family: var(--font-body);
    font-weight: 600; font-size: 0.85rem; padding: 10px 16px; cursor: pointer;
    border-bottom: 2px solid transparent; transition: color 0.15s ease, border-color 0.15s ease;
    white-space: nowrap;
  }
  .subtab-btn[data-active="true"] { color: var(--text); }
  .subtabs.tone-overview .subtab-btn[data-active="true"] { border-color: var(--gold); }

  .subpanel { display: none; padding: 26px 28px 30px; }
  .subpanel.visible { display: block; }

  .subpanel h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.35rem; margin: 0 0 20px; line-height: 1.35; }

  /* --- Dashboard stat tiles --- */
  .tile-row { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 22px; }
  @media (min-width: 640px) { .tile-row { grid-template-columns: 1fr 1fr; } }

  .tile {
    border-radius: 10px; padding: 18px 20px; border: 1px solid var(--border);
    background: var(--surface);
  }
  .tile.tone-positive { border-color: var(--positive); background: linear-gradient(135deg, var(--positive-dim), var(--surface) 70%); }
  .tile.tone-negative { border-color: var(--negative); background: linear-gradient(135deg, var(--negative-dim), var(--surface) 70%); }
  .tile.tone-neutral { border-color: var(--neutral); background: linear-gradient(135deg, var(--neutral-dim), var(--surface) 70%); }
  .tile.tone-unclear { border-color: var(--unclear); background: var(--surface); }

  .tile-label { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
  .tile-value { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; text-transform: capitalize; }
  .tile.tone-positive .tile-value { color: var(--positive); }
  .tile.tone-negative .tile-value { color: var(--negative); }
  .tile.tone-neutral .tile-value { color: var(--neutral); }
  .tile-sub { font-size: 0.88rem; color: var(--text-muted); margin-top: 6px; }

  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  .field-label { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
  .field-value { font-size: 0.96rem; }
  .field-value a { color: inherit; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font-size: 0.85rem; padding: 6px 14px; border-radius: 20px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
  }

  ul.plain { margin: 0; padding-left: 0; list-style: none; }
  ul.plain li { margin-bottom: 10px; padding-left: 18px; position: relative; }
  ul.plain li::before { content: "\2022"; position: absolute; left: 0; color: var(--brand-c); }

  .empty-state { color: var(--text-muted); font-size: 0.9rem; }

  .card-list { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 720px) { .card-list { grid-template-columns: 1fr 1fr; } }

  .mini-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(33,29,23,0.05); transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .mini-card:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(33,29,23,0.08); }
  .mini-card-title { font-weight: 600; font-size: 0.92rem; margin-bottom: 4px; }
  .mini-card.cast-accent { border-left: 3px solid var(--cast-accent); background: var(--cast-tint); }
  .mini-card.news-accent { border-left: 3px solid var(--news-accent); background: var(--news-tint); }
  .mini-card.marketing-accent { border-left: 3px solid var(--marketing-accent); background: var(--marketing-tint); }

  .export-row { text-align: center; margin-top: 24px; display: none; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #export-btn, #pdf-btn {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    font-family: var(--font-body); font-size: 0.85rem; padding: 9px 20px;
    border-radius: 8px; cursor: pointer; transition: all 0.15s ease;
  }
  #export-btn:hover { border-color: var(--gold); color: var(--gold); }
  #pdf-btn { border-color: var(--brand-c); color: var(--brand-c); }
  #pdf-btn:hover { background: var(--brand-c); color: var(--on-ink); }
  #pdf-btn:disabled { opacity: 0.5; cursor: default; }

  @media (max-width: 560px) {
    .search-row { flex-direction: column; }
    #search-btn { padding: 14px; }
    .page { padding: 30px 16px 90px; }
    .subtab-btn { font-size: 0.8rem; padding: 10px 10px; }
  }

  /* Printed/saved-as-PDF output */
  @media print {
    /* Without this, Chrome/Firefox/Safari silently drop every
       background-color, background-image and box-shadow on print —
       which is why verdict badges, opp-risk tiles, voice cards and
       meta pills were printing flat/blank instead of matching the
       on-screen design. This forces them to render as authored. */
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }

    /* A real, consistent page margin — relying on the browser/OS print
       dialog's own default margin is what was producing inconsistent
       spacing. This fixes it the same way regardless of print settings. */
    @page { margin: 16mm 18mm; }

    .film-strip, .search-row, .example-chips, #progress, .status, .export-row { display: none !important; }
    .subtabs, .evidence-section, .subpanel { display: block !important; }
    .page { max-width: 100%; padding: 0; }

    /* Only atomic, single-idea pieces get break-inside:avoid. Applying
       it to large multi-part containers (the whole evidence section,
       the whole war room, the whole memo card) asks the browser to
       keep something taller than a page together, which it can't do —
       instead it tends to shove the whole block onto a fresh page,
       leaving a large gap and effectively re-sorting the section order
       on the printed page. That's what was showing up as sections
       being split apart oddly. */
    .voice-card, .mini-card { break-inside: avoid; }

    /* The rotated "stamp" look is a screen-only flourish; keeping a
       rotated element in the print layout can shift how its text gets
       read back out of the page (e.g. by copy/search), so it's
       disabled here rather than just cosmetically ignored. */
    .verdict-badge { transform: none !important; }

    /* The on-screen theme is already ink-on-paper, so unlike before,
       nothing here needs to be recolored for print — just force the
       page itself to pure white to save ink, which the color-adjust
       rule above won't override since it's an explicit background. */
    body { background: #fff; }
    .hero-banner-overlay { position: static; background: none; padding: 12px 0; }
    .hero-banner img { display: none; }

    /* The letterpress ghost-strike on "ECHO" is a screen-only flourish;
       printed, its absolute-positioned duplicate can still show up in
       the text layer on copy/search. Keep just the main word for print. */
    .echo-trail { display: none !important; }

    /* Shadows don't serve a printed page and can render as odd smudges
       depending on the print engine. */
    * { box-shadow: none !important; }
  }
</style>
</head>
<body>
  <div class="film-strip"></div>
  <div class="page">
    <div class="hero">
      <div class="marquee-band">
        <div class="filmecho-logo">
          <span class="logo-film">FILM</span>
          <div class="logo-echo-wrapper">
            <span class="echo-trail">ECHO</span>
            <span class="logo-echo-main">ECHO</span>
          </div>
        </div>
        <p class="tagline">The AI studio intelligence room — search, listen, understand, decide.</p>
      </div>

      <div class="search-row">
        <input id="title-input" type="text" placeholder="Enter a film or show title..." autocomplete="off">
        <button id="search-btn">Run brief</button>
      </div>

      <div id="example-chips" class="example-chips">
        <span class="example-chips-label">Try:</span>
        <button class="example-chip" data-title="Dune Part Three">Dune Part Three</button>
        <button class="example-chip" data-title="Avengers Doomsday">Avengers Doomsday</button>
        <button class="example-chip" data-title="Haiwaan">Haiwaan</button>
        <button class="example-chip" data-title="Doomsday 2008">Doomsday (2008)</button>
      </div>

      <div id="progress" class="progress">
        <div class="progress-title">Pipeline progress</div>
        <div id="progress-timer" class="progress-timer"><span class="progress-timer-dot"></span><span id="progress-timer-text">Running for 0s...</span></div>
        <div id="progress-list"></div>
        <div class="activity-feed-title">Live agent activity</div>
        <div id="activity-feed" class="activity-feed"></div>
      </div>
      <div id="status" class="status"></div>
    </div>

    <div id="hero-banner" class="hero-banner">
      <img id="hero-banner-img" alt="">
      <div class="hero-banner-overlay">
        <div id="hero-banner-title" class="hero-banner-title"></div>
        <div id="hero-banner-meta" class="hero-banner-meta"></div>
      </div>
    </div>
    <div id="marquee-fallback" class="marquee-fallback">
      <div id="marquee-fallback-title" class="hero-banner-title"></div>
      <div id="marquee-fallback-meta" class="hero-banner-meta"></div>
    </div>

    <div id="cache-note" class="cache-note"></div>

    <div id="greenlight-card" class="greenlight-card"></div>

    <div id="war-room" class="war-room">
      <div class="war-room-title">The War Room</div>
      <div id="war-room-grid" class="war-room-grid"></div>
    </div>

    <div id="timeline-card" class="timeline-card"></div>

    <div id="release-window-card" class="release-window-card"></div>

    <div class="export-row" id="export-row">
      <button id="export-btn">Export / print memo</button>
      <button id="pdf-btn">Download PDF report</button>
    </div>

    <div id="evidence-section" class="evidence-section">
      <div class="subtabs tone-overview">
        <button class="subtab-btn" data-sub="evidence-marketing" data-active="true">Marketing</button>
        <button class="subtab-btn" data-sub="evidence-cast" data-active="false">Cast</button>
        <button class="subtab-btn" data-sub="evidence-news" data-active="false">News</button>
        <button id="evidence-collections-btn" class="subtab-btn" data-sub="evidence-collections" data-active="false" style="display:none;">Collections</button>
      </div>
      <div id="evidence-marketing" class="subpanel visible"></div>
      <div id="evidence-cast" class="subpanel"></div>
      <div id="evidence-news" class="subpanel"></div>
      <div id="evidence-collections" class="subpanel"></div>
    </div>
  </div>
  <div class="film-strip"></div>

<script>
const titleInput = document.getElementById('title-input');
const searchBtn = document.getElementById('search-btn');
const progress = document.getElementById('progress');
const progressList = document.getElementById('progress-list');
const activityFeed = document.getElementById('activity-feed');
const progressTimerText = document.getElementById('progress-timer-text');
const status = document.getElementById('status');
const heroBanner = document.getElementById('hero-banner');
const heroBannerImg = document.getElementById('hero-banner-img');
const heroBannerTitle = document.getElementById('hero-banner-title');
const heroBannerMeta = document.getElementById('hero-banner-meta');
const marqueeFallback = document.getElementById('marquee-fallback');
const marqueeFallbackTitle = document.getElementById('marquee-fallback-title');
const marqueeFallbackMeta = document.getElementById('marquee-fallback-meta');
const greenlightCard = document.getElementById('greenlight-card');
const warRoom = document.getElementById('war-room');
const warRoomGrid = document.getElementById('war-room-grid');
const releaseWindowCard = document.getElementById('release-window-card');
const evidenceSection = document.getElementById('evidence-section');
const evidenceCollectionsBtn = document.getElementById('evidence-collections-btn');
const evidenceCollections = document.getElementById('evidence-collections');
const exampleChips = document.getElementById('example-chips');
const exportRow = document.getElementById('export-row');
const exportBtn = document.getElementById('export-btn');
const pdfBtn = document.getElementById('pdf-btn');
const cacheNote = document.getElementById('cache-note');

let activeSource = null;
let lastPayloadData = null;
let lastSearchedTitle = '';

const STAGES = [
  { key: 'entity_resolution', label: 'Resolving title' },
  { key: 'web_sentiment', label: 'Web sentiment' },
  { key: 'youtube', label: 'YouTube reactions' },
  { key: 'competitive', label: 'Competitive landscape' },
  { key: 'news', label: 'Production & cast news' },
  { key: 'cast', label: 'Cast reception' },
  { key: 'marketing', label: 'Marketing analysis' },
  { key: 'sentiment_synthesis', label: 'Sentiment synthesis' },
  { key: 'main_synthesis', label: 'Greenlight memo' },
];
const TWO_PHASE = new Set(['entity_resolution', 'sentiment_synthesis', 'main_synthesis']);
let stageState = {};
let timerInterval = null;
let timerStart = null;

function startTimer() {
  timerStart = Date.now();
  progressTimerText.textContent = 'Running for 0s...';
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const secs = Math.floor((Date.now() - timerStart) / 1000);
    progressTimerText.textContent = `Running for ${secs}s...`;
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
}

function resetProgress() {
  stageState = {};
  STAGES.forEach(s => { stageState[s.key] = 'pending'; });
  renderProgress();
  activityFeed.innerHTML = '';
  startTimer();
}

function renderProgress() {
  progressList.innerHTML = STAGES.map(s => {
    const state = stageState[s.key];
    return `<div class="progress-item ${state}"><span class="progress-dot"></span>${s.label}</div>`;
  }).join('');
}

const STAGE_LABEL_LOOKUP = Object.fromEntries(STAGES.map(s => [s.key, s.label]));

function activityLineHtml(line) {
  let cls = '';
  if (line.startsWith('calling ')) cls = 'tool-call';
  else if (line.includes('returned') || line.includes('parsed') || line.includes('complete')) cls = 'tool-return';
  const safe = line.replace(/</g, '&lt;');
  return cls ? `<span class="${cls}">${safe}</span>` : safe;
}

function appendActivity(stage, log) {
  if (!log || !log.length) return;
  const label = STAGE_LABEL_LOOKUP[stage] || stage;
  log.forEach(line => {
    const el = document.createElement('div');
    el.className = 'activity-line new';
    el.innerHTML = `<span class="agent-tag">[${label}]</span> ${activityLineHtml(line)}`;
    activityFeed.appendChild(el);
  });
  activityFeed.scrollTop = activityFeed.scrollHeight;
}

function markStage(key) {
  if (key === 'fetch') {
    ['web_sentiment', 'youtube', 'competitive', 'news', 'cast', 'marketing'].forEach(k => {
      if (stageState[k] === 'pending') stageState[k] = 'active';
    });
  } else if (TWO_PHASE.has(key)) {
    stageState[key] = stageState[key] === 'pending' ? 'active' : 'done';
  } else if (key in stageState) {
    stageState[key] = 'done';
  }
  renderProgress();
}

function riskTone(risk) {
  switch ((risk || 'unclear').toLowerCase()) {
    case 'low': return 'positive';
    case 'moderate': return 'neutral';
    case 'high': return 'negative';
    default: return 'unclear';
  }
}

function verdictTone(verdict) {
  switch ((verdict || 'unclear').toLowerCase()) {
    case 'greenlight':
    case 'blockbuster':
    case 'hit': return 'positive';
    case 'greenlight_with_changes':
    case 'average': return 'neutral';
    case 'hold':
    case 'pass':
    case 'underperformed':
    case 'flop': return 'negative';
    default: return 'unclear';
  }
}

function releaseLabel(entity) {
  if (entity.release_status === 'released') return 'Retrospective';
  if (entity.release_status === 'upcoming') return entity.release_year ? `Coming ${entity.release_year}` : 'Upcoming release';
  return 'Screening status unclear';
}

function sentimentTone(sentiment) {
  switch ((sentiment || 'unclear').toLowerCase()) {
    case 'positive': return 'positive';
    case 'mixed': return 'neutral';
    case 'negative': return 'negative';
    default: return 'unclear';
  }
}

function buildMetaPills(entity) {
  const pills = [];
  if (entity.director) pills.push(`<span class="meta-pill info">Dir. ${entity.director}</span>`);
  pills.push(`<span class="meta-pill info">${entity.release_date || entity.release_year || 'release date unknown'}</span>`);
  if (entity.release_status && entity.release_status !== 'unclear') pills.push(`<span class="meta-pill info">${entity.release_status}</span>`);
  if (entity.based_on && entity.source_type !== 'original' && entity.source_type !== 'unclear') {
    pills.push(`<span class="meta-pill info">${entity.based_on}</span>`);
  }
  return pills.join('');
}

// --- Sub-tab wiring (generic; works for the single evidence-section bar) ---
document.querySelectorAll('.subtabs').forEach(group => {
  group.addEventListener('click', (e) => {
    const btn = e.target.closest('.subtab-btn');
    if (!btn) return;
    group.querySelectorAll('.subtab-btn').forEach(b => b.dataset.active = String(b === btn));
    const panelSet = group.parentElement.querySelectorAll('.subpanel');
    panelSet.forEach(p => p.classList.toggle('visible', p.id === btn.dataset.sub));
  });
});

function internalSearchLink(title) {
  const safe = title.replace(/"/g, '&quot;');
  return `<a href="/?title=${encodeURIComponent(title)}" target="_blank" rel="noopener" title="Search &quot;${safe}&quot; on Filmecho">${title}</a>`;
}

function sourceLink(url) {
  return url ? ` <a href="${url}" target="_blank" rel="noopener">source</a>` : '';
}

const VERDICT_LABELS = {
  greenlight: 'GREENLIGHT',
  greenlight_with_changes: 'GREENLIGHT WITH CHANGES',
  hold: 'HOLD',
  pass: 'PASS',
};

const ROLE_META = {
  director: { icon: '\u{1F3AC}', label: 'The Director' },
  producer: { icon: '\u{1F3AF}', label: 'The Producer' },
  marketing_chief: { icon: '\u{1F4E3}', label: 'The Marketing Chief' },
  casting_executive: { icon: '\u{1F3AD}', label: 'The Casting Executive' },
  distribution_executive: { icon: '\u{1F5D3}\uFE0F', label: 'The Distribution Executive' },
  analyst: { icon: '\u{1F4CA}', label: 'The Analyst' },
};

function renderGreenlightMemo(memo, releaseStatus) {
  if (!memo) {
    greenlightCard.innerHTML = '<p class="empty-state">No memo was returned for this run.</p>';
    greenlightCard.classList.add('visible');
    return;
  }
  const tone = verdictTone(memo.verdict);
  greenlightCard.className = `greenlight-card visible tone-${tone}`;

  const why = (memo.why || []).map(w => `<li>${w}</li>`).join('') || '<li>No specific reasons surfaced.</li>';
  const changeLabel = releaseStatus === 'released' ? 'Lessons learned' : "What we'd change";
  const changeItems = releaseStatus === 'released' ? (memo.lessons_learned || []) : (memo.what_we_would_change || []);
  const changesBlock = changeItems.length
    ? `<div class="field"><div class="field-label">${changeLabel}</div><ul class="plain">${changeItems.map(c => `<li>${c}</li>`).join('')}</ul></div>` : '';

  const notableNews = (memo.notable_news || []).map(n => `<li>${n.claim}${sourceLink(n.url)}</li>`).join('');
  const newsBlock = notableNews ? `<div class="field"><div class="field-label">Notable news</div><ul class="plain">${notableNews}</ul></div>` : '';

  greenlightCard.innerHTML = `
    <div class="verdict-row">
      <span class="verdict-badge tone-${tone}"><span class="verdict-dot"></span>${VERDICT_LABELS[memo.verdict] || 'VERDICT UNCLEAR'}</span>
      <span class="confidence-wrap">
        Confidence: ${memo.confidence}%
        <span class="confidence-bar"><span class="confidence-bar-fill tone-${tone}" style="width:${memo.confidence}%"></span></span>
      </span>
    </div>
    <h2>${memo.headline || ''}</h2>
    <div class="field"><div class="field-label">Why</div><ul class="plain">${why}</ul></div>
    <div class="opp-risk-row">
      <div class="opp-risk-tile opportunity"><div class="opp-risk-label">Biggest opportunity</div><div class="field-value">${memo.biggest_opportunity || ''}</div></div>
      <div class="opp-risk-tile risk"><div class="opp-risk-label">Biggest risk</div><div class="field-value">${memo.biggest_risk || ''}</div></div>
    </div>
    <div class="field"><div class="field-label">Recommended action</div><div class="field-value">${memo.recommended_action || ''}</div></div>
    ${changesBlock}
    ${newsBlock}
  `;
}

function renderWarRoom(voices) {
  if (!voices || !voices.length) {
    warRoom.classList.remove('visible');
    return;
  }
  warRoomGrid.innerHTML = voices.map(v => {
    const meta = ROLE_META[v.role] || { icon: '\u{1F4AC}', label: v.role };
    return `
      <div class="voice-card role-${v.role}">
        <div class="voice-role"><span class="voice-icon">${meta.icon}</span>${meta.label}</div>
        <div class="voice-insight">&ldquo;${v.insight}&rdquo;</div>
      </div>
    `;
  }).join('');
  warRoom.classList.add('visible');
}

const PHASE_LABELS = {
  pre_release: 'Pre-release',
  trailer: 'Trailer',
  opening_weekend: 'Opening Weekend',
  week_two: 'Week 2',
  long_tail: 'Long-tail',
};
const PHASE_ORDER = ['pre_release', 'trailer', 'opening_weekend', 'week_two', 'long_tail'];

function renderTimeline(timeline) {
  const el = document.getElementById('timeline-card');
  if (!timeline || !timeline.length) {
    el.classList.remove('visible');
    return;
  }
  const sorted = [...timeline].sort((a, b) => PHASE_ORDER.indexOf(a.phase) - PHASE_ORDER.indexOf(b.phase));
  el.innerHTML = `
    <div class="timeline-title">The Life of Its Reputation</div>
    <div class="timeline-track">
      ${sorted.map(entry => `
        <div class="timeline-stop tone-${sentimentTone(entry.sentiment)}">
          <div class="timeline-phase-label">${PHASE_LABELS[entry.phase] || entry.phase}</div>
          <div class="timeline-note">${entry.note || ''}</div>
        </div>
      `).join('')}
    </div>
  `;
  el.classList.add('visible');
}

function renderReleaseWindow(competitive) {
  const rw = competitive && competitive.release_window;
  if (!rw || (rw.congestion === 'unclear' && rw.suggested_direction === 'unclear')) {
    releaseWindowCard.classList.remove('visible');
    return;
  }
  const congestionTone = riskTone(rw.congestion);
  const DIRECTION_LABELS = {
    keep_current_window: 'Keep current window',
    consider_earlier: 'Consider shifting earlier',
    consider_later: 'Consider shifting later',
    unclear: 'Direction unclear',
  };
  releaseWindowCard.innerHTML = `
    <div class="rw-header">
      <span class="rw-title">\u{1F5D3}\uFE0F Release Window Advisory</span>
      <span class="pill tone-${congestionTone}" style="font-family:var(--font-mono);font-size:0.78rem;padding:3px 10px;border-radius:20px;border:1px solid currentColor;">${rw.congestion} congestion</span>
    </div>
    <div class="field-value">${rw.reasoning || ''}</div>
    <div class="field-value" style="margin-top:8px;font-weight:600;">${DIRECTION_LABELS[rw.suggested_direction] || ''}</div>
    <div class="rw-caveat">Directional read based on real competing titles found this run — not a projection of what a different date would actually produce.</div>
  `;
  releaseWindowCard.classList.add('visible');
}

function marketingLabels(releaseStatus) {
  if (releaseStatus === 'released') {
    return { worked: 'What worked', under: 'What underperformed' };
  }
  return { worked: 'Positive signals so far', under: 'Concerns so far' };
}

function renderMarketing(marketing, releaseStatus) {
  const el = document.getElementById('evidence-marketing');
  if (!marketing) { el.innerHTML = '<h2>Marketing</h2><p class="empty-state">No marketing coverage surfaced for this run.</p>'; return; }
  const labels = marketingLabels(releaseStatus);
  const strategies = (marketing.strategies_observed || []).map(s =>
    `<div class="mini-card marketing-accent"><div class="field-value">${s.claim}${sourceLink(s.url)}</div></div>`
  ).join('') || '<p class="empty-state">None surfaced.</p>';
  const worked = (marketing.what_worked || []).map(w => `<li>${w.claim}${sourceLink(w.url)}</li>`).join('') || '<li class="empty-state" style="list-style:none">None surfaced.</li>';
  const under = (marketing.what_underperformed || []).map(w => `<li>${w.claim}${sourceLink(w.url)}</li>`).join('') || '<li class="empty-state" style="list-style:none">None surfaced.</li>';
  const lessons = (marketing.lessons_learned && marketing.lessons_learned.length)
    ? `<div class="field"><div class="field-label">Lessons learned</div><ul class="plain">${marketing.lessons_learned.map(l => `<li>${l}</li>`).join('')}</ul></div>` : '';
  el.innerHTML = `
    <h2>Marketing ${releaseStatus === 'released' ? 'retrospective' : 'campaign, in progress'}</h2>
    <div class="field"><div class="field-label">Strategies observed</div><div class="card-list">${strategies}</div></div>
    <div class="field"><div class="field-label">${labels.worked}</div><ul class="plain">${worked}</ul></div>
    <div class="field"><div class="field-label">${labels.under}</div><ul class="plain">${under}</ul></div>
    ${lessons}
  `;
}

function renderCast(cast) {
  const el = document.getElementById('evidence-cast');
  if (!cast) { el.innerHTML = '<h2>Cast reception</h2><p class="empty-state">No cast-specific coverage surfaced for this run.</p>'; return; }
  const perf = (cast.performances || []).map(p => `
    <div class="mini-card cast-accent">
      <div class="mini-card-title">${p.actor}</div>
      <div class="field-value">${p.note}${p.source_url ? ` <a href="${p.source_url}" target="_blank" rel="noopener">source</a>` : ''}</div>
    </div>
  `).join('') || '<p class="empty-state">No per-actor reception surfaced.</p>';
  const personal = (cast.personal_updates || []).map(p => `
    <div class="mini-card marketing-accent">
      <div class="mini-card-title">${p.actor} — ${p.headline}</div>
      ${p.detail ? `<div class="field-value">${p.detail}</div>` : ''}
      ${p.source_url ? `<div class="field-value"><a href="${p.source_url}" target="_blank" rel="noopener">source</a></div>` : ''}
    </div>
  `).join('');
  el.innerHTML = `
    <h2>Cast reception</h2>
    ${cast.standout_performance ? `<div class="field"><div class="field-label">Standout</div><div class="field-value">${cast.standout_performance}</div></div>` : ''}
    ${cast.overall_cast_reception ? `<div class="field"><div class="field-label">Overall</div><div class="field-value">${cast.overall_cast_reception}</div></div>` : ''}
    <div class="field"><div class="field-label">Performances</div><div class="card-list">${perf}</div></div>
    ${personal ? `<div class="field"><div class="field-label">Behind the scenes</div><div class="card-list">${personal}</div></div>` : ''}
  `;
}

function renderNews(news) {
  const el = document.getElementById('evidence-news');
  if (!news || (!news.facts?.length && !news.rumors?.length)) {
    el.innerHTML = '<h2>Production &amp; cast news</h2><p class="empty-state">No news surfaced for this run.</p>';
    return;
  }
  const CATEGORY_LABELS = { casting: 'Casting', production: 'Production', release: 'Release', box_office: 'Box office', other: 'Other' };
  const grouped = {};
  [...(news.facts || []), ...(news.rumors || []).map(r => ({ ...r, isRumor: true }))].forEach(item => {
    const cat = item.category || 'other';
    (grouped[cat] = grouped[cat] || []).push(item);
  });
  const sections = Object.keys(CATEGORY_LABELS)
    .filter(cat => grouped[cat] && grouped[cat].length)
    .map(cat => {
      const items = grouped[cat].map(item =>
        `<div class="mini-card news-accent"><div class="field-value">${item.claim}${item.isRumor ? ' <span style="color:var(--text-muted)">(rumor)</span>' : ''}${sourceLink(item.url)}</div></div>`
      ).join('');
      return `<div class="field"><div class="field-label">${CATEGORY_LABELS[cat]}</div><div class="card-list">${items}</div></div>`;
    }).join('');
  el.innerHTML = `<h2>Production &amp; cast news</h2>${sections}`;
}

function computeYoutubeStats(youtubeData) {
  if (!youtubeData || !Object.keys(youtubeData).length) return null;
  let totalViews = 0, totalLikes = 0, totalComments = 0;
  let topComment = null;
  Object.values(youtubeData).forEach(v => {
    totalViews += v.view_count || 0;
    totalLikes += v.like_count || 0;
    totalComments += v.comment_count || 0;
    (v.comments || []).forEach(c => {
      if (!topComment || (c.like_count || 0) > (topComment.like_count || 0)) topComment = c;
    });
  });
  return { totalViews, totalLikes, totalComments, topComment };
}

function formatCount(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(n);
}

function renderCollections(competitive, youtubeData) {
  const bo = (competitive && competitive.box_office) || {};
  const tone = verdictTone(bo.verdict);
  const boFields = [
    ['Budget', bo.budget], ['Worldwide gross', bo.worldwide_gross],
    ['Domestic gross', bo.domestic_gross], ['Opening weekend', bo.opening_weekend],
  ].filter(([, v]) => v);

  const boTiles = boFields.length
    ? `<div class="tile-row">${boFields.map(([label, v]) =>
        `<div class="tile tone-unclear"><div class="tile-label">${label}</div><div class="tile-value" style="font-size:1rem">${v}</div></div>`
      ).join('')}</div>`
    : '<p class="empty-state">No specific box office figures surfaced for this run.</p>';

  const verdictBlock = bo.verdict && bo.verdict !== 'unclear' ? `
    <div class="tile-row">
      <div class="tile tone-${tone}"><div class="tile-label">Commercial verdict</div><div class="tile-value">${bo.verdict}</div><div class="tile-sub">${bo.verdict_basis || ''}</div></div>
    </div>
  ` : '';

  const ytStats = computeYoutubeStats(youtubeData);
  const ytBlock = ytStats ? `
    <div class="field"><div class="field-label">Trailer reach</div>
      <div class="tile-row">
        <div class="tile tone-unclear"><div class="tile-label">Views</div><div class="tile-value">${formatCount(ytStats.totalViews)}</div></div>
        <div class="tile tone-unclear"><div class="tile-label">Likes</div><div class="tile-value">${formatCount(ytStats.totalLikes)}</div></div>
      </div>
    </div>` : '';

  const competitors = (competitive && competitive.competing_titles || []);
  const compTable = competitors.length ? `
    <div class="field">
      <div class="field-label">Vs. competing titles</div>
      <div class="card-list">
        ${competitors.map(c => `
          <div class="mini-card">
            <div class="mini-card-title">${internalSearchLink(c.title)}</div>
            <div class="field-value">${c.strength_vs_searched || ''}</div>
            ${c.gross_estimate ? `<div class="field-value" style="color:var(--gold)">Their gross: ${c.gross_estimate}</div>` : ''}
          </div>
        `).join('')}
      </div>
    </div>` : '';

  evidenceCollections.innerHTML = `
    <h2>Collections &amp; comparative performance</h2>
    ${verdictBlock}
    <div class="field"><div class="field-label">Box office</div>${boTiles}</div>
    ${ytBlock}
    ${compTable}
  `;
}

function renderHero(entity, youtubeData) {
  const label = releaseLabel(entity);
  const titleHtml = `${label}: ${entity.title || ''}`;
  const metaHtml = buildMetaPills(entity);

  const firstThumb = youtubeData ? Object.values(youtubeData).map(v => v.thumbnail_url).find(u => u) : null;

  if (firstThumb) {
    heroBannerImg.src = firstThumb;
    heroBannerImg.alt = entity.title || '';
    heroBannerTitle.textContent = titleHtml;
    heroBannerMeta.innerHTML = metaHtml;
    heroBanner.classList.add('visible');
    marqueeFallback.classList.remove('visible');
  } else {
    marqueeFallbackTitle.textContent = titleHtml;
    marqueeFallbackMeta.innerHTML = metaHtml;
    marqueeFallback.classList.add('visible');
    heroBanner.classList.remove('visible');
  }
}

function renderConfidenceNote(entity, result) {
  if (!result.entity_confidence || result.entity_confidence === 'high') {
    status.classList.remove('visible');
    status.innerHTML = '';
    return;
  }
  const note = result.disambiguation_note ? ` — ${result.disambiguation_note}` : '';
  let html = `Title match confidence: ${result.entity_confidence}${note}`;

  const candidates = entity.candidates || [];
  if (candidates.length > 1) {
    const chips = candidates.map(c =>
      `<button class="candidate-chip" data-title="${c.title.replace(/"/g, '&quot;')}">${c.title}${c.year ? ' (' + c.year + ')' : ''}</button>`
    ).join(' ');
    html += `<div style="margin-top:10px">Did you mean: ${chips}</div>`;
  }

  status.innerHTML = html;
  status.classList.add('visible');
}

function renderCacheNote(entity, data) {
  // Only released titles are ever cached (see orchestration/memo_cache.py) —
  // upcoming/unclear titles always reflect the current live pipeline run,
  // so there's nothing to explain or offer to refresh.
  if (entity.release_status !== 'released') {
    cacheNote.classList.remove('visible');
    cacheNote.innerHTML = '';
    return;
  }
  const text = data.served_from_cache
    ? `Showing the frozen memo for this released title, originally computed ${new Date(data.cached_at).toLocaleString()}. Released titles aren't re-researched on every search.`
    : `This memo is now frozen as the standing result for this released title — future searches will serve this same version.`;
  cacheNote.innerHTML = `
    <span class="cache-note-text">${text}</span>
    <button id="refresh-btn">Refresh this memo</button>
  `;
  cacheNote.classList.add('visible');
}

cacheNote.addEventListener('click', (e) => {
  if (!e.target.closest('#refresh-btn')) return;
  const btn = e.target.closest('#refresh-btn');
  btn.disabled = true;
  btn.textContent = 'Refreshing...';
  titleInput.value = lastSearchedTitle;
  runBrief(true);
});

function getRegionHint() {
  try {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
    const locale = navigator.language || '';
    return [tz, locale].filter(Boolean).join(', ');
  } catch {
    return '';
  }
}

async function runBrief(forceRefresh = false) {
  const title = titleInput.value.trim();
  if (!title) { status.textContent = 'Enter a title first.'; status.classList.add('visible'); return; }

  if (activeSource) { activeSource.close(); activeSource = null; }

  searchBtn.disabled = true;
  exampleChips.style.display = 'none';
  exportRow.style.display = 'none';
  cacheNote.classList.remove('visible');
  lastPayloadData = null;
  lastSearchedTitle = title;
  heroBanner.classList.remove('visible');
  marqueeFallback.classList.remove('visible');
  greenlightCard.classList.remove('visible');
  warRoom.classList.remove('visible');
  document.getElementById('timeline-card').classList.remove('visible');
  releaseWindowCard.classList.remove('visible');
  evidenceSection.classList.remove('visible');
  evidenceCollectionsBtn.style.display = 'none';
  status.classList.remove('visible');
  resetProgress();
  progress.classList.add('visible');

  const regionHint = getRegionHint();
  const source = new EventSource(
    `/api/brief/stream?title=${encodeURIComponent(title)}&region_hint=${encodeURIComponent(regionHint)}`
    + (forceRefresh ? '&force_refresh=true' : '')
  );
  activeSource = source;

  source.onmessage = (raw) => {
    let payload;
    try { payload = JSON.parse(raw.data); } catch { return; }

    if (payload.event === 'stage') {
      if (payload.stage === 'cache_hit' || payload.stage === 'cache_refresh') {
        progressTimerText.textContent = payload.message;
      }
      markStage(payload.stage);
      return;
    }
    if (payload.event === 'activity') { appendActivity(payload.stage, payload.log); return; }

    if (payload.event === 'error') {
      progress.classList.remove('visible');
      stopTimer();
      status.textContent = `Something went wrong: ${payload.message}`;
      status.classList.add('visible');
      source.close(); activeSource = null; searchBtn.disabled = false;
      return;
    }

    if (payload.event === 'result') {
      source.close(); activeSource = null; searchBtn.disabled = false;
      progress.classList.remove('visible');
      stopTimer();

      const data = payload.data;
      lastPayloadData = data;
      const entity = data.entity || {};
      const result = data.result || {};

      renderHero(entity, data.youtube);
      renderConfidenceNote(entity, result);

      renderGreenlightMemo(result, entity.release_status);
      renderWarRoom(result.war_room);
      renderTimeline(data.sentiment_synthesis && data.sentiment_synthesis.timeline);
      renderReleaseWindow(data.competitive);

      renderMarketing(data.marketing, entity.release_status);
      renderCast(data.cast);
      renderNews(data.news);

      const isReleased = entity.release_status === 'released';
      evidenceCollectionsBtn.style.display = isReleased ? '' : 'none';
      if (isReleased) {
        renderCollections(data.competitive, data.youtube);
      } else {
        // If a previous (released) run left Collections as the active
        // sub-tab, fall back to Marketing rather than showing an empty
        // conditional tab for this (upcoming) title.
        const activeBtn = evidenceSection.querySelector('.subtab-btn[data-active="true"]');
        if (activeBtn && activeBtn.dataset.sub === 'evidence-collections') {
          evidenceSection.querySelectorAll('.subtab-btn').forEach(b => b.dataset.active = String(b.dataset.sub === 'evidence-marketing'));
          evidenceSection.querySelectorAll('.subpanel').forEach(p => p.classList.toggle('visible', p.id === 'evidence-marketing'));
        }
      }

      evidenceSection.classList.add('visible');
      exportRow.style.display = 'flex';

      renderCacheNote(entity, data);
    }
  };

  source.onerror = () => {
    if (activeSource !== source) return;
    source.close(); activeSource = null;
    progress.classList.remove('visible');
    stopTimer();
    status.textContent = 'Connection lost while running the pipeline.';
    status.classList.add('visible');
    searchBtn.disabled = false;
  };
}

searchBtn.addEventListener('click', runBrief);
titleInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') runBrief(); });

exampleChips.addEventListener('click', (e) => {
  const chip = e.target.closest('.example-chip');
  if (!chip) return;
  titleInput.value = chip.dataset.title;
  runBrief();
});

exportBtn.addEventListener('click', () => window.print());

pdfBtn.addEventListener('click', async () => {
  if (!lastPayloadData) return;
  pdfBtn.disabled = true;
  const originalLabel = pdfBtn.textContent;
  pdfBtn.textContent = 'Generating...';
  try {
    const res = await fetch('/api/brief/pdf', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(lastPayloadData),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || `Request failed (${res.status})`);
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const safeTitle = ((lastPayloadData.entity || {}).title || 'brief').replace(/[^A-Za-z0-9_-]+/g, '_');
    const a = document.createElement('a');
    a.href = url;
    a.download = `filmecho-${safeTitle}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (err) {
    alert(`PDF generation failed: ${err.message}`);
  } finally {
    pdfBtn.disabled = false;
    pdfBtn.textContent = originalLabel;
  }
});

status.addEventListener('click', (e) => {
  const chip = e.target.closest('.candidate-chip');
  if (!chip) return;
  titleInput.value = chip.dataset.title;
  runBrief();
});

// Deep-linking: a competing-title link opens /?title=X in a new tab, this
// picks that up on load and runs the search immediately, so the new tab
// isn't just a blank homepage.
(function initFromQueryParam() {
  const params = new URLSearchParams(window.location.search);
  const deepLinkTitle = params.get('title');
  if (deepLinkTitle) {
    titleInput.value = deepLinkTitle;
    runBrief();
  }
})();
</script>
