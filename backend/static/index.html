<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filmecho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0d10;
    --bg-vignette: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(217,169,78,0.10), transparent 70%);
    --surface: #17151a;
    --surface-raised: #201d24;
    --border: #322e37;
    --text: #ede9e0;
    --text-muted: #9b968d;

    --gold: #d9a94e;
    --gold-dim: #7a6431;

    --positive: #4cbb74;
    --positive-dim: #234a30;
    --negative: #e5484d;
    --negative-dim: #5c2224;
    --neutral: #f0a83e;
    --neutral-dim: #5c4520;
    --unclear: #6b6862;
    --unclear-dim: #322e37;

    --marketing-accent: #a78bfa;
    --cast-accent: #5fa8e0;
    --news-accent: #e2637a;

    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Inter", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg) var(--bg-vignette);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.55;
    min-height: 100vh;
  }

  .film-strip {
    height: 12px;
    background-image: radial-gradient(circle, var(--border) 2.5px, transparent 3px);
    background-size: 26px 12px;
    background-repeat: repeat-x;
    background-position: center;
  }

  .page { max-width: 900px; margin: 0 auto; padding: 40px 24px 100px; }
  .hero { max-width: 640px; margin: 0 auto; text-align: center; }

  .brand {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2.2rem, 5vw, 3.2rem);
    letter-spacing: -0.01em;
    margin: 28px 0 6px;
  }

  .brand span { color: var(--gold); }
  .tagline { color: var(--text-muted); font-size: 0.95rem; margin: 0; }

  .search-row { display: flex; gap: 10px; margin: 32px 0 0; }

  #title-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 1rem;
    padding: 14px 16px;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  #title-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(217,169,78,0.15); }
  #title-input::placeholder { color: var(--text-muted); }

  #search-btn {
    background: var(--gold);
    color: #1a1408;
    border: none;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.95rem;
    padding: 0 26px;
    border-radius: 6px;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  #search-btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
  #search-btn:disabled { opacity: 0.5; cursor: default; }
  #search-btn:focus-visible, #title-input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .marquee {
    display: none;
    margin: 28px 0 0;
    border: 1px solid var(--gold-dim);
    border-radius: 6px;
    padding: 12px 18px;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    background: rgba(217,169,78,0.05);
  }

  .marquee.visible { display: block; }

  .meta-bar { display: none; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; }
  .meta-bar.visible { display: flex; }

  .meta-pill {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--text-muted);
  }

  .meta-pill.info { border-color: var(--cast-accent); color: var(--cast-accent); }
  .meta-pill.confidence-high { border-color: var(--positive); color: var(--positive); }
  .meta-pill.confidence-medium { border-color: var(--neutral); color: var(--neutral); }
  .meta-pill.confidence-low { border-color: var(--negative); color: var(--negative); }

  .poster {
    display: none;
    margin-top: 22px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .poster.visible { display: block; }
  .poster img { width: 100%; height: auto; display: block; aspect-ratio: 16/7; object-fit: cover; }

  /* --- Progress checklist: replaces a single fleeting status line with
     a persistent list, so "what's happening" stays visible instead of
     flashing past. --- */
  .progress {
    display: none;
    margin-top: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    text-align: left;
  }

  .progress.visible { display: block; }

  .progress-title {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .progress-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 5px 0;
    font-size: 0.88rem;
    color: var(--text-muted);
  }

  .progress-dot {
    width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
    background: var(--unclear-dim);
    border: 1px solid var(--border);
  }

  .progress-item.active { color: var(--text); }
  .progress-item.active .progress-dot {
    background: var(--gold);
    border-color: var(--gold);
  }
  @media (prefers-reduced-motion: no-preference) {
    .progress-item.active .progress-dot { animation: pulse 1s ease-in-out infinite; }
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .progress-item.done { color: var(--positive); }
  .progress-item.done .progress-dot { background: var(--positive); border-color: var(--positive); }

  .status {
    text-align: center;
    color: var(--negative);
    font-family: var(--font-mono);
    font-size: 0.85rem;
    margin-top: 18px;
    display: none;
  }

  .status.visible { display: block; }

  @media (prefers-reduced-motion: no-preference) {
    .panel, .marquee, .poster { animation: rise 0.3s ease; }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* --- Tabs --- */
  .tabs { display: none; gap: 8px; margin-top: 32px; }
  .tabs.visible { display: flex; }

  .tab-btn {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.92rem;
    padding: 13px;
    border-radius: 8px 8px 0 0;
    border-bottom: 3px solid var(--border);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .tab-btn[data-tone="positive"] { border-bottom-color: var(--positive); }
  .tab-btn[data-tone="negative"] { border-bottom-color: var(--negative); }
  .tab-btn[data-tone="neutral"] { border-bottom-color: var(--neutral); }
  .tab-btn[data-tone="unclear"] { border-bottom-color: var(--unclear); }

  .tab-btn[data-active="true"] {
    color: var(--text);
    background: var(--surface-raised);
  }
  .tab-btn[data-active="true"][data-tone="positive"] { border-bottom-width: 4px; box-shadow: inset 0 -1px 0 var(--positive); }
  .tab-btn[data-active="true"][data-tone="negative"] { border-bottom-width: 4px; box-shadow: inset 0 -1px 0 var(--negative); }
  .tab-btn[data-active="true"][data-tone="neutral"] { border-bottom-width: 4px; box-shadow: inset 0 -1px 0 var(--neutral); }

  .panel {
    display: none;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 10px 10px;
    padding: 30px 28px;
  }

  .panel.visible { display: block; }

  .panel h2 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.4rem;
    margin: 0 0 20px;
    line-height: 1.35;
  }

  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }

  .field-label {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .field-value { font-size: 0.98rem; }
  .field-value a { color: inherit; }

  .pill {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid currentColor;
  }

  .pill.tone-positive { color: var(--positive); }
  .pill.tone-negative { color: var(--negative); }
  .pill.tone-neutral { color: var(--neutral); }
  .pill.tone-unclear { color: var(--unclear); }

  ul.plain { margin: 0; padding-left: 18px; }
  ul.plain li { margin-bottom: 6px; }

  .empty-state { color: var(--text-muted); font-size: 0.9rem; }

  .subsection {
    margin-top: 26px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .subsection-title {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .subsection.marketing .subsection-title { color: var(--marketing-accent); }
  .subsection.cast .subsection-title { color: var(--cast-accent); }
  .subsection.news .subsection-title { color: var(--news-accent); }

  @media (max-width: 520px) {
    .search-row { flex-direction: column; }
    #search-btn { padding: 14px; }
    .page { padding: 28px 16px 80px; }
    .tab-btn { font-size: 0.82rem; padding: 11px 6px; }
  }
</style>
</head>
<body>
  <div class="film-strip"></div>
  <div class="page">
    <div class="hero">
      <h1 class="brand">Film<span>echo</span></h1>
      <p class="tagline">Trailer sentiment, competitive read, cast reception, and marketing analysis, in one brief.</p>

      <div class="search-row">
        <input id="title-input" type="text" placeholder="Enter a film or show title..." autocomplete="off">
        <button id="search-btn">Run brief</button>
      </div>

      <div id="marquee" class="marquee"></div>
      <div id="meta-bar" class="meta-bar"></div>
      <div id="poster" class="poster"><img id="poster-img" alt=""></div>

      <div id="progress" class="progress">
        <div class="progress-title">Pipeline progress</div>
        <div id="progress-list"></div>
      </div>
      <div id="status" class="status"></div>
    </div>

    <div id="tabs" class="tabs">
      <button class="tab-btn" data-view="studio" data-active="true">Studio brief</button>
      <button class="tab-btn" data-view="fan" data-active="false">Fan pulse</button>
    </div>
    <div id="studio-panel" class="panel"></div>
    <div id="fan-panel" class="panel"></div>
  </div>
  <div class="film-strip"></div>

<script>
const titleInput = document.getElementById('title-input');
const searchBtn = document.getElementById('search-btn');
const marquee = document.getElementById('marquee');
const metaBar = document.getElementById('meta-bar');
const poster = document.getElementById('poster');
const posterImg = document.getElementById('poster-img');
const progress = document.getElementById('progress');
const progressList = document.getElementById('progress-list');
const status = document.getElementById('status');
const tabs = document.getElementById('tabs');
const studioPanel = document.getElementById('studio-panel');
const fanPanel = document.getElementById('fan-panel');

let activeSource = null;
let currentView = 'studio';

// Fixed display order for the checklist. Actual completion order (for
// the 6 fetch agents) is unpredictable — as_completed() finishes them
// whenever they finish — but the checklist itself stays in one place so
// it's easy to scan, only each row's state changes.
const STAGES = [
  { key: 'entity_resolution', label: 'Resolving title' },
  { key: 'web_sentiment', label: 'Web sentiment' },
  { key: 'youtube', label: 'YouTube reactions' },
  { key: 'competitive', label: 'Competitive landscape' },
  { key: 'news', label: 'Production & cast news' },
  { key: 'cast', label: 'Cast reception' },
  { key: 'marketing', label: 'Marketing analysis' },
  { key: 'sentiment_synthesis', label: 'Sentiment synthesis' },
  { key: 'main_synthesis', label: 'Final brief' },
];
// Stages that get exactly one "started" event then one "finished" event
// from the server (as opposed to the 6 fetch agents, which only ever
// send a single completion event each).
const TWO_PHASE = new Set(['entity_resolution', 'sentiment_synthesis', 'main_synthesis']);

let stageState = {};

function resetProgress() {
  stageState = {};
  STAGES.forEach(s => { stageState[s.key] = 'pending'; });
  renderProgress();
}

function renderProgress() {
  progressList.innerHTML = STAGES.map(s => {
    const state = stageState[s.key];
    return `<div class="progress-item ${state}"><span class="progress-dot"></span>${s.label}</div>`;
  }).join('');
}

function markStage(key) {
  if (key === 'fetch') {
    // Meta-event: the four-agent-plus-YouTube fetch stage just started.
    ['web_sentiment', 'youtube', 'competitive', 'news', 'cast', 'marketing'].forEach(k => {
      if (stageState[k] === 'pending') stageState[k] = 'active';
    });
  } else if (TWO_PHASE.has(key)) {
    stageState[key] = stageState[key] === 'pending' ? 'active' : 'done';
  } else if (key in stageState) {
    stageState[key] = 'done';
  }
  renderProgress();
}

function riskTone(risk) {
  switch ((risk || 'unclear').toLowerCase()) {
    case 'low': return 'positive';
    case 'moderate': return 'neutral';
    case 'high': return 'negative';
    default: return 'unclear';
  }
}

function excitementTone(level) {
  switch ((level || 'unclear').toLowerCase()) {
    case 'high': return 'positive';
    case 'mixed': return 'neutral';
    case 'low': return 'negative';
    default: return 'unclear';
  }
}

function releaseLabel(entity) {
  if (entity.release_status === 'released') return 'Retrospective';
  if (entity.release_status === 'upcoming') {
    return entity.release_year ? `Coming ${entity.release_year}` : 'Upcoming release';
  }
  return 'Screening status unclear';
}

function renderMarketingSubsection(marketing) {
  if (!marketing) {
    return '<div class="subsection marketing"><div class="subsection-title">Marketing</div><p class="empty-state">No marketing coverage surfaced for this run.</p></div>';
  }
  const strategies = (marketing.strategies_observed || []).map(s => `<li>${s}</li>`).join('') || '<li>None surfaced.</li>';
  const worked = (marketing.what_worked || []).map(w => `<li>${w.claim}</li>`).join('') || '<li>None surfaced.</li>';
  const underperformed = (marketing.what_underperformed || []).map(w => `<li>${w.claim}</li>`).join('') || '<li>None surfaced.</li>';
  const lessons = (marketing.lessons_learned && marketing.lessons_learned.length)
    ? `<div class="field"><div class="field-label">Lessons learned</div><ul class="plain">${marketing.lessons_learned.map(l => `<li>${l}</li>`).join('')}</ul></div>`
    : '';
  return `
    <div class="subsection marketing">
      <div class="subsection-title">Marketing</div>
      <div class="field"><div class="field-label">Strategies observed</div><ul class="plain">${strategies}</ul></div>
      <div class="field"><div class="field-label">What worked</div><ul class="plain">${worked}</ul></div>
      <div class="field"><div class="field-label">What underperformed</div><ul class="plain">${underperformed}</ul></div>
      ${lessons}
    </div>
  `;
}

function renderCastSubsection(cast) {
  if (!cast || !cast.performances || !cast.performances.length) {
    return '<div class="subsection cast"><div class="subsection-title">Cast reception</div><p class="empty-state">No cast-specific coverage surfaced for this run.</p></div>';
  }
  const rows = cast.performances.map(p => `
    <div class="field">
      <div class="field-label">${p.actor}</div>
      <div class="field-value">${p.note}${p.source_url ? ` <a href="${p.source_url}" target="_blank" rel="noopener">source</a>` : ''}</div>
    </div>
  `).join('');
  return `
    <div class="subsection cast">
      <div class="subsection-title">Cast reception</div>
      ${cast.standout_performance ? `<div class="field"><div class="field-label">Standout</div><div class="field-value">${cast.standout_performance}</div></div>` : ''}
      ${cast.overall_cast_reception ? `<div class="field"><div class="field-label">Overall</div><div class="field-value">${cast.overall_cast_reception}</div></div>` : ''}
      ${rows}
    </div>
  `;
}

function renderNewsSubsection(news) {
  if (!news || (!news.facts?.length && !news.rumors?.length)) {
    return '<div class="subsection news"><div class="subsection-title">Cast &amp; production news</div><p class="empty-state">No news surfaced for this run.</p></div>';
  }
  const facts = (news.facts || []).map(f => `<li>${f.claim}</li>`).join('');
  const rumors = (news.rumors || []).map(r => `<li>${r.claim} <span style="color:var(--text-muted)">(rumor)</span></li>`).join('');
  return `
    <div class="subsection news">
      <div class="subsection-title">Cast &amp; production news</div>
      <ul class="plain">${facts}${rumors}</ul>
    </div>
  `;
}

function renderStudio(brief, cast, marketing) {
  const tone = riskTone(brief?.competitive_risk);
  document.querySelector('.tab-btn[data-view="studio"]').dataset.tone = tone;

  if (!brief) {
    studioPanel.innerHTML = '<p class="empty-state">No studio brief was returned for this run.</p>';
    return;
  }
  const news = (brief.notable_news || []).map(n => `<li>${n}</li>`).join('') || '<li>No recent news surfaced.</li>';
  const lessonsBlock = (brief.lessons_learned && brief.lessons_learned.length)
    ? `<div class="field"><div class="field-label">Lessons learned</div><ul class="plain">${brief.lessons_learned.map(l => `<li>${l}</li>`).join('')}</ul></div>`
    : '';
  studioPanel.innerHTML = `
    <h2>${brief.headline || ''}</h2>
    <div class="field">
      <div class="field-label">Sentiment</div>
      <div class="field-value">${brief.sentiment_summary || ''}</div>
    </div>
    <div class="field">
      <div class="field-label">Competitive risk</div>
      <div class="field-value"><span class="pill tone-${tone}">${brief.competitive_risk || 'unclear'}</span></div>
    </div>
    <div class="field">
      <div class="field-label">Notable news</div>
      <ul class="plain">${news}</ul>
    </div>
    ${lessonsBlock}
    <div class="field">
      <div class="field-label">Recommendation</div>
      <div class="field-value">${brief.recommendation || ''}</div>
    </div>
    ${renderMarketingSubsection(marketing)}
    ${renderCastSubsection(cast)}
  `;
}

function renderFan(brief, news) {
  const tone = excitementTone(brief?.excitement_level);
  document.querySelector('.tab-btn[data-view="fan"]').dataset.tone = tone;

  if (!brief) {
    fanPanel.innerHTML = '<p class="empty-state">No fan pulse was returned for this run.</p>';
    return;
  }
  const themes = (brief.top_themes || []).map(t => `<li>${t}</li>`).join('') || '<li>No recurring themes surfaced.</li>';
  const worthBlock = brief.worth_watching
    ? `<div class="field"><div class="field-label">Worth watching?</div><div class="field-value">${brief.worth_watching}</div></div>`
    : '';
  fanPanel.innerHTML = `
    <h2>${brief.headline || ''}</h2>
    <div class="field">
      <div class="field-label">Excitement level</div>
      <div class="field-value"><span class="pill tone-${tone}">${brief.excitement_level || 'unclear'}</span></div>
    </div>
    <div class="field">
      <div class="field-label">What fans are talking about</div>
      <ul class="plain">${themes}</ul>
    </div>
    ${worthBlock}
    <div class="field">
      <div class="field-label">Fun fact</div>
      <div class="field-value">${brief.fun_fact_or_news || '\u2014'}</div>
    </div>
    ${renderNewsSubsection(news)}
  `;
}

function renderMetaBar(entity, result) {
  const pills = [];
  if (entity.director) pills.push(`<span class="meta-pill info">Dir. ${entity.director}</span>`);
  if (entity.release_year) pills.push(`<span class="meta-pill info">${entity.release_year}</span>`);
  if (entity.release_status && entity.release_status !== 'unclear') {
    pills.push(`<span class="meta-pill info">${entity.release_status}</span>`);
  }
  if (result.entity_confidence) {
    pills.push(`<span class="meta-pill confidence-${result.entity_confidence}">match: ${result.entity_confidence}</span>`);
  }
  metaBar.innerHTML = pills.join('');
  metaBar.classList.toggle('visible', pills.length > 0);
}

function renderPoster(youtubeData) {
  const firstThumb = youtubeData
    ? Object.values(youtubeData).map(v => v.thumbnail_url).find(u => u)
    : null;
  if (firstThumb) {
    posterImg.src = firstThumb;
    posterImg.alt = 'Trailer thumbnail';
    poster.classList.add('visible');
  } else {
    poster.classList.remove('visible');
    posterImg.src = '';
  }
}

function showView(view) {
  currentView = view;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.dataset.active = String(btn.dataset.view === view);
  });
  studioPanel.classList.toggle('visible', view === 'studio');
  fanPanel.classList.toggle('visible', view === 'fan');
}

tabs.addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (btn) showView(btn.dataset.view);
});

async function runBrief() {
  const title = titleInput.value.trim();
  if (!title) {
    status.textContent = 'Enter a title first.';
    status.classList.add('visible');
    return;
  }

  if (activeSource) {
    activeSource.close();
    activeSource = null;
  }

  searchBtn.disabled = true;
  marquee.classList.remove('visible');
  metaBar.classList.remove('visible');
  poster.classList.remove('visible');
  tabs.classList.remove('visible');
  studioPanel.classList.remove('visible');
  fanPanel.classList.remove('visible');
  status.classList.remove('visible');
  resetProgress();
  progress.classList.add('visible');

  const source = new EventSource(`/api/brief/stream?title=${encodeURIComponent(title)}`);
  activeSource = source;

  source.onmessage = (raw) => {
    let payload;
    try {
      payload = JSON.parse(raw.data);
    } catch {
      return;
    }

    if (payload.event === 'stage') {
      markStage(payload.stage);
      return;
    }

    if (payload.event === 'error') {
      progress.classList.remove('visible');
      status.textContent = `Something went wrong: ${payload.message}`;
      status.classList.add('visible');
      source.close();
      activeSource = null;
      searchBtn.disabled = false;
      return;
    }

    if (payload.event === 'result') {
      source.close();
      activeSource = null;
      searchBtn.disabled = false;
      progress.classList.remove('visible');

      const data = payload.data;
      const entity = data.entity || {};
      const result = data.result || {};

      marquee.textContent = `${releaseLabel(entity)}: ${entity.title || title}`;
      marquee.classList.add('visible');
      renderMetaBar(entity, result);
      renderPoster(data.youtube);

      if (result.entity_confidence && result.entity_confidence !== 'high') {
        const note = result.disambiguation_note ? ` — ${result.disambiguation_note}` : '';
        status.textContent = `Title match confidence: ${result.entity_confidence}${note}`;
        status.classList.add('visible');
      }

      renderStudio(result.studio_brief, data.cast, data.marketing);
      renderFan(result.fan_pulse, data.news);
      tabs.classList.add('visible');
      showView(currentView);
    }
  };

  source.onerror = () => {
    if (activeSource !== source) return;
    source.close();
    activeSource = null;
    progress.classList.remove('visible');
    status.textContent = 'Connection lost while running the pipeline.';
    status.classList.add('visible');
    searchBtn.disabled = false;
  };
}

searchBtn.addEventListener('click', runBrief);
titleInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') runBrief();
});
</script>
</body>
</html>
