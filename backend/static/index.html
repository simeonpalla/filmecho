<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filmecho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0d10;
    --bg-vignette: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(217,169,78,0.08), transparent 70%);
    --surface: #17151a;
    --surface-raised: #201d24;
    --border: #322e37;
    --text: #ede9e0;
    --text-muted: #9b968d;
    --gold: #d9a94e;
    --gold-dim: #7a6431;
    --studio: #3fa9a0;
    --studio-dim: #1f544f;
    --fan: #e2637a;
    --fan-dim: #6f2e3a;
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Inter", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg) var(--bg-vignette);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.55;
    min-height: 100vh;
  }

  .film-strip {
    height: 12px;
    background-image: radial-gradient(circle, var(--border) 2.5px, transparent 3px);
    background-size: 26px 12px;
    background-repeat: repeat-x;
    background-position: center;
  }

  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 24px 100px;
  }

  .hero {
    max-width: 640px;
    margin: 0 auto;
    text-align: center;
  }

  .brand {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2.2rem, 5vw, 3.2rem);
    letter-spacing: -0.01em;
    margin: 28px 0 6px;
  }

  .brand span { color: var(--gold); }

  .tagline {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin: 0;
  }

  .search-row {
    display: flex;
    gap: 10px;
    margin: 32px 0 0;
  }

  #title-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 1rem;
    padding: 14px 16px;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  #title-input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(217,169,78,0.15);
  }

  #title-input::placeholder { color: var(--text-muted); }

  #search-btn {
    background: var(--gold);
    color: #1a1408;
    border: none;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.95rem;
    padding: 0 26px;
    border-radius: 6px;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  #search-btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
  #search-btn:disabled { opacity: 0.5; cursor: default; }
  #search-btn:focus-visible, #title-input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .marquee {
    display: none;
    margin: 32px 0 0;
    border: 1px solid var(--gold-dim);
    border-radius: 6px;
    padding: 12px 18px;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    background: rgba(217,169,78,0.05);
  }

  .marquee.visible { display: block; }

  .meta-bar {
    display: none;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 16px;
  }

  .meta-bar.visible { display: flex; }

  .meta-pill {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--text-muted);
  }

  .meta-pill.confidence-high { border-color: var(--studio); color: var(--studio); }
  .meta-pill.confidence-medium { border-color: var(--gold); color: var(--gold); }
  .meta-pill.confidence-low { border-color: var(--fan); color: var(--fan); }

  .status {
    text-align: center;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 0.85rem;
    margin-top: 24px;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .status.visible { display: flex; }
  .status.error { color: var(--fan); }

  .spinner {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 2px solid var(--border);
    border-top-color: var(--gold);
  }

  @media (prefers-reduced-motion: no-preference) {
    .spinner { animation: spin 0.8s linear infinite; }
    .brief, .marquee { animation: rise 0.3s ease; }
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .results-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    margin-top: 36px;
  }

  @media (min-width: 780px) {
    .results-grid { grid-template-columns: 1fr 1fr; }
  }

  .brief {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 24px;
    border-left-width: 3px;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }

  .brief.visible { display: block; }
  .brief:hover { transform: translateY(-2px); }
  .brief.studio { border-left-color: var(--studio); }
  .brief.fan { border-left-color: var(--fan); }
  .brief.cast { border-left-color: var(--gold); }
  .brief.marketing { border-left-color: var(--gold); }

  .brief-eyebrow {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .brief.studio .brief-eyebrow { color: var(--studio); }
  .brief.fan .brief-eyebrow { color: var(--fan); }
  .brief.cast .brief-eyebrow, .brief.marketing .brief-eyebrow { color: var(--gold); }

  .brief h2 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.25rem;
    margin: 0 0 18px;
    line-height: 1.35;
  }

  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }

  .field-label {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .field-value { font-size: 0.96rem; }
  .field-value a { color: inherit; }

  .pill {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid currentColor;
  }

  .pill.risk-high, .pill.excite-low { color: var(--fan); }
  .pill.risk-moderate, .pill.excite-mixed { color: var(--gold); }
  .pill.risk-low, .pill.excite-high { color: var(--studio); }
  .pill.risk-unclear, .pill.excite-unclear { color: var(--text-muted); }

  ul.plain { margin: 0; padding-left: 18px; }
  ul.plain li { margin-bottom: 6px; }

  .empty-state {
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  @media (max-width: 520px) {
    .search-row { flex-direction: column; }
    #search-btn { padding: 14px; }
    .page { padding: 28px 16px 80px; }
  }
</style>
</head>
<body>
  <div class="film-strip"></div>
  <div class="page">
    <div class="hero">
      <h1 class="brand">Film<span>echo</span></h1>
      <p class="tagline">Trailer sentiment, competitive read, cast reception, and marketing analysis, in one brief.</p>

      <div class="search-row">
        <input id="title-input" type="text" placeholder="Enter a film or show title..." autocomplete="off">
        <button id="search-btn">Run brief</button>
      </div>

      <div id="marquee" class="marquee"></div>
      <div id="meta-bar" class="meta-bar"></div>
      <div id="status" class="status"><span id="status-spinner" class="spinner"></span><span id="status-text"></span></div>
    </div>

    <div class="results-grid">
      <div id="studio-brief" class="brief studio"></div>
      <div id="fan-brief" class="brief fan"></div>
      <div id="cast-brief" class="brief cast"></div>
      <div id="marketing-brief" class="brief marketing"></div>
    </div>
  </div>
  <div class="film-strip"></div>

<script>
const titleInput = document.getElementById('title-input');
const searchBtn = document.getElementById('search-btn');
const marquee = document.getElementById('marquee');
const metaBar = document.getElementById('meta-bar');
const status = document.getElementById('status');
const statusSpinner = document.getElementById('status-spinner');
const statusText = document.getElementById('status-text');
const studioEl = document.getElementById('studio-brief');
const fanEl = document.getElementById('fan-brief');
const castEl = document.getElementById('cast-brief');
const marketingEl = document.getElementById('marketing-brief');

let activeSource = null;

function showStatus(text, isError, showSpinner) {
  statusText.textContent = text || '';
  status.classList.toggle('visible', !!text);
  status.classList.toggle('error', !!isError);
  statusSpinner.style.display = showSpinner ? '' : 'none';
}

function riskPillClass(prefix, value) {
  const v = (value || 'unclear').toLowerCase();
  return `pill ${prefix}-${v}`;
}

function renderStudio(brief) {
  if (!brief) {
    studioEl.innerHTML = '<div class="brief-eyebrow">Studio brief</div><p class="empty-state">No studio brief was returned for this run.</p>';
    return;
  }
  const news = (brief.notable_news || []).map(n => `<li>${n}</li>`).join('') || '<li>No recent news surfaced.</li>';
  const lessonsBlock = (brief.lessons_learned && brief.lessons_learned.length)
    ? `<div class="field"><div class="field-label">Lessons learned</div><ul class="plain">${brief.lessons_learned.map(l => `<li>${l}</li>`).join('')}</ul></div>`
    : '';
  studioEl.innerHTML = `
    <div class="brief-eyebrow">Studio brief</div>
    <h2>${brief.headline || ''}</h2>
    <div class="field">
      <div class="field-label">Sentiment</div>
      <div class="field-value">${brief.sentiment_summary || ''}</div>
    </div>
    <div class="field">
      <div class="field-label">Competitive risk</div>
      <div class="field-value"><span class="${riskPillClass('risk', brief.competitive_risk)}">${brief.competitive_risk || 'unclear'}</span></div>
    </div>
    <div class="field">
      <div class="field-label">Notable news</div>
      <ul class="plain">${news}</ul>
    </div>
    ${lessonsBlock}
    <div class="field">
      <div class="field-label">Recommendation</div>
      <div class="field-value">${brief.recommendation || ''}</div>
    </div>
  `;
}

function renderFan(brief) {
  if (!brief) {
    fanEl.innerHTML = '<div class="brief-eyebrow">Fan pulse</div><p class="empty-state">No fan pulse was returned for this run.</p>';
    return;
  }
  const themes = (brief.top_themes || []).map(t => `<li>${t}</li>`).join('') || '<li>No recurring themes surfaced.</li>';
  const worthBlock = brief.worth_watching
    ? `<div class="field"><div class="field-label">Worth watching?</div><div class="field-value">${brief.worth_watching}</div></div>`
    : '';
  fanEl.innerHTML = `
    <div class="brief-eyebrow">Fan pulse</div>
    <h2>${brief.headline || ''}</h2>
    <div class="field">
      <div class="field-label">Excitement level</div>
      <div class="field-value"><span class="${riskPillClass('excite', brief.excitement_level)}">${brief.excitement_level || 'unclear'}</span></div>
    </div>
    <div class="field">
      <div class="field-label">What fans are talking about</div>
      <ul class="plain">${themes}</ul>
    </div>
    ${worthBlock}
    <div class="field">
      <div class="field-label">Fun fact</div>
      <div class="field-value">${brief.fun_fact_or_news || '\u2014'}</div>
    </div>
  `;
}

function renderCast(cast) {
  if (!cast || !cast.performances || !cast.performances.length) {
    castEl.innerHTML = '<div class="brief-eyebrow">Cast reception</div><p class="empty-state">No cast-specific coverage surfaced for this run.</p>';
    return;
  }
  const rows = cast.performances.map(p => `
    <div class="field">
      <div class="field-label">${p.actor}</div>
      <div class="field-value">${p.note}${p.source_url ? ` <a href="${p.source_url}" target="_blank" rel="noopener">source</a>` : ''}</div>
    </div>
  `).join('');
  castEl.innerHTML = `
    <div class="brief-eyebrow">Cast reception</div>
    <h2>How the cast landed</h2>
    ${cast.standout_performance ? `<div class="field"><div class="field-label">Standout</div><div class="field-value">${cast.standout_performance}</div></div>` : ''}
    ${cast.overall_cast_reception ? `<div class="field"><div class="field-label">Overall</div><div class="field-value">${cast.overall_cast_reception}</div></div>` : ''}
    ${rows}
  `;
}

function renderMarketing(marketing) {
  if (!marketing) {
    marketingEl.innerHTML = '<div class="brief-eyebrow">Marketing</div><p class="empty-state">No marketing coverage surfaced for this run.</p>';
    return;
  }
  const strategies = (marketing.strategies_observed || []).map(s => `<li>${s}</li>`).join('') || '<li>None surfaced.</li>';
  const worked = (marketing.what_worked || []).map(w => `<li>${w.claim}</li>`).join('') || '<li>None surfaced.</li>';
  const underperformed = (marketing.what_underperformed || []).map(w => `<li>${w.claim}</li>`).join('') || '<li>None surfaced.</li>';
  const lessonsBlock = (marketing.lessons_learned && marketing.lessons_learned.length)
    ? `<div class="field"><div class="field-label">Lessons learned</div><ul class="plain">${marketing.lessons_learned.map(l => `<li>${l}</li>`).join('')}</ul></div>`
    : '';
  marketingEl.innerHTML = `
    <div class="brief-eyebrow">Marketing</div>
    <h2>Campaign read</h2>
    <div class="field">
      <div class="field-label">Strategies observed</div>
      <ul class="plain">${strategies}</ul>
    </div>
    <div class="field">
      <div class="field-label">What worked</div>
      <ul class="plain">${worked}</ul>
    </div>
    <div class="field">
      <div class="field-label">What underperformed</div>
      <ul class="plain">${underperformed}</ul>
    </div>
    ${lessonsBlock}
  `;
}

function renderMetaBar(entity, result) {
  const pills = [];
  if (entity.director) pills.push(`<span class="meta-pill">Dir. ${entity.director}</span>`);
  if (entity.release_year) pills.push(`<span class="meta-pill">${entity.release_year}</span>`);
  if (entity.release_status && entity.release_status !== 'unclear') {
    pills.push(`<span class="meta-pill">${entity.release_status}</span>`);
  }
  if (result.entity_confidence) {
    pills.push(`<span class="meta-pill confidence-${result.entity_confidence}">match: ${result.entity_confidence}</span>`);
  }
  metaBar.innerHTML = pills.join('');
  metaBar.classList.toggle('visible', pills.length > 0);
}

async function runBrief() {
  const title = titleInput.value.trim();
  if (!title) {
    showStatus('Enter a title first.', true, false);
    return;
  }

  if (activeSource) {
    activeSource.close();
    activeSource = null;
  }

  searchBtn.disabled = true;
  marquee.classList.remove('visible');
  metaBar.classList.remove('visible');
  [studioEl, fanEl, castEl, marketingEl].forEach(el => el.classList.remove('visible'));
  showStatus('Connecting...', false, true);

  const source = new EventSource(`/api/brief/stream?title=${encodeURIComponent(title)}`);
  activeSource = source;

  source.onmessage = (raw) => {
    let payload;
    try {
      payload = JSON.parse(raw.data);
    } catch {
      return;
    }

    if (payload.event === 'stage') {
      showStatus(payload.message, false, true);
      return;
    }

    if (payload.event === 'error') {
      showStatus(`Something went wrong: ${payload.message}`, true, false);
      source.close();
      activeSource = null;
      searchBtn.disabled = false;
      return;
    }

    if (payload.event === 'result') {
      source.close();
      activeSource = null;
      searchBtn.disabled = false;

      const data = payload.data;
      const entity = data.entity || {};
      const result = data.result || {};

      const statusLabel = entity.release_status === 'released' ? 'Retrospective'
        : entity.release_status === 'upcoming' ? 'Now screening'
        : 'Screening status unclear';
      marquee.textContent = `${statusLabel}: ${entity.title || title}${entity.release_year ? ' (' + entity.release_year + ')' : ''}`;
      marquee.classList.add('visible');
      renderMetaBar(entity, result);

      if (result.entity_confidence && result.entity_confidence !== 'high') {
        const note = result.disambiguation_note ? ` — ${result.disambiguation_note}` : '';
        showStatus(`Title match confidence: ${result.entity_confidence}${note}`, true, false);
      } else {
        showStatus('', false, false);
      }

      renderStudio(result.studio_brief);
      renderFan(result.fan_pulse);
      renderCast(data.cast);
      renderMarketing(data.marketing);
      [studioEl, fanEl, castEl, marketingEl].forEach(el => el.classList.add('visible'));
    }
  };

  source.onerror = () => {
    if (activeSource !== source) return;
    source.close();
    activeSource = null;
    showStatus('Connection lost while running the pipeline.', true, false);
    searchBtn.disabled = false;
  };
}

searchBtn.addEventListener('click', runBrief);
titleInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') runBrief();
});
</script>
</body>
</html>
